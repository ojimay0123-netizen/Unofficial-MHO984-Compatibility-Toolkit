name: Package published release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c "import os,pathlib; assert os.environ['RELEASE_TAG'] == 'v' + pathlib.Path('VERSION.txt').read_text().strip()"
      - name: Build ZIP and SHA-256
        run: python scripts/package_release.py
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256
