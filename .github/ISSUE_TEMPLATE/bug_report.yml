name: Bug report / 不具合報告
description: Report a reproducible problem with acquisition, Viewer, decoding, or protocol analysis.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem.
        不具合報告ありがとうございます。

        Before posting logs or datasets, please review them for IP addresses, serial numbers, usernames, paths, and confidential waveform content.
        ログやデータセットを公開する前に、IPアドレス、シリアル番号、ユーザー名、パス、機密性のある波形内容が含まれていないか確認してください。

  - type: input
    id: toolkit_version
    attributes:
      label: Toolkit version / Toolkitバージョン
      placeholder: v0.1.0-beta.7
    validations:
      required: true

  - type: input
    id: model_firmware
    attributes:
      label: Oscilloscope model and firmware / オシロの機種とFirmware
      placeholder: MHO984 / 00.01.00
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area / 発生箇所
      options:
        - Online acquisition / オシロから波形取得
        - Offline BIN import / 保存済みBIN
        - Viewer
        - Protocol Analyzer / プロトコル解析
        - Setup / 起動・環境構築
        - Other / その他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現手順
      description: Please provide the shortest reproducible sequence.
      placeholder: |
        1. Start START_MHO984_Toolkit.bat
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期待した動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 実際の動作
      description: Include the exact error text when available.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / 診断情報
      description: Prefer the redacted diagnostics ZIP generated by the Toolkit. Do not upload raw waveform BIN unless it is genuinely required and safe to share.
      placeholder: Drag a redacted diagnostics ZIP here, or paste a short sanitized log excerpt.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 公開前確認
      options:
        - label: I reviewed the material for sensitive IP addresses, serial numbers, usernames, paths, and confidential waveform data. / 公開する内容に機密情報がないことを確認しました。
          required: true
